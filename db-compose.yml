version: '3.8'

services:
  db:
    image: mysql:9.0
    container_name: freelance-travel-db
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: travel_db
      MYSQL_USER: freelance_travel
      MYSQL_PASSWORD: freelance_travel
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  laravel:
    driver: bridge

volumes:
  db_data:
