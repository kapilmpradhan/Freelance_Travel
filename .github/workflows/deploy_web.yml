name: Freelance travel web deployment

on:
  workflow_dispatch:
    inputs:
      aws-access-key-id: 
        description: 'AWS access key id'
        required: true
      aws-secret-access-key: 
        description: 'AWS secret access key'
        required: true
      aws-session-token: 
        description: 'AWS session token'
        required: true

env:
  S3_BUCKET_NAME: apptest-freelance-travel-com

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH for Deploy Key
        run: |
          mkdir ~/.ssh
          echo "${{ secrets.WEB_REPO_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          cat ~/.ssh/id_rsa
          chmod 700 ~/.ssh/id_rsa

      - name: Checkout Code
        run: |
          git clone --branch feat/link-agent-account --single-branch git@github.com:websitetravel/freelance-website.git

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.9.0'

      - name: Install dependencies
        run: |
          npm install
        working-directory: freelance-website

      - name: Build Frontend
        run: npm run build:staging
        working-directory: freelance-website

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli
      
      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ github.event.inputs.aws-access-key-id }}
          aws-secret-access-key: ${{ github.event.inputs.aws-secret-access-key }}
          aws-session-token: ${{ github.event.inputs.aws-session-token }}
          aws-region: ap-southeast-2

      - name: Remove all files from S3
        run: aws s3 rm s3://$S3_BUCKET_NAME --recursive --region $AWS_REGION

      - name: Deploy Frontend to S3
        run: |
          aws s3 sync freelance-website/build/ s3://$S3_BUCKET_NAME --delete --region $AWS_REGION
