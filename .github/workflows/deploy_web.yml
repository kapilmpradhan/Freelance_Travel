name: Freelance travel web deployment

on:
  workflow_dispatch:
    inputs:
      aws-access-key-id: 
        description: 'AWS access key id'
        required: true
      aws-secret-access-key: 
        description: 'AWS secret access key'
        required: true
      aws-session-token: 
        description: 'AWS session token'
        required: true
      github-branch-name:
        description: 'Github repo branch name for web.'
        required: true
      platform:
        description: 'Platform to deploy to (freelance or peterpans)'
        required: true
        default: 'freelance'
      environment:
        description: 'Environment to deploy to (staging or production)'
        required: true
        default: 'staging'

env:
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
  S3_BUCKET_NAME_PETERPANS: ${{ vars.S3_BUCKET_NAME_PETERPANS }}
  CLARITY_CODE_BLOCK : ${{ vars.CLARITY_CODE_BLOCK }}
  HELP_SCOUT_CODE_BLOCK: ${{ vars.HELP_SCOUT_CODE_BLOCK }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  PLATFORM: ${{ github.event.inputs.platform }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Fail on Invalid Platform
        if: ${{ github.event.inputs.platform != 'freelance' && github.event.inputs.platform != 'peterpans' }}
        run: |
          echo "Invalid platform: ${{ github.event.inputs.platform }}. Options are 'freelance' or 'peterpans'."
          exit 1

      - name: Fail on Invalid Environment
        if: ${{ github.event.inputs.environment != 'staging' && github.event.inputs.environment != 'production' }}
        run: |
          echo "Invalid environment: ${{ github.event.inputs.environment }}. Options are 'staging' or 'production'."
          exit 1

      - name: Set up SSH for Deploy Key
        run: |
          mkdir ~/.ssh
          echo "${{ secrets.WEB_REPO_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 700 ~/.ssh/id_rsa

      - name: Checkout Code
        run: |
          git clone --branch ${{ github.event.inputs.github-branch-name }} --single-branch git@github.com:websitetravel/freelance-website.git

      - name: Setup index html
        run: |
          cd freelance-website
          export PLATFORM=${{ github.event.inputs.platform }}
          envsubst < public-$PLATFORM/index.tpl.html > public-$PLATFORM/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.9.0'

      - name: Install dependencies
        run: |
          npm install
        working-directory: freelance-website

      - name: Build Frontend
        run: npm run build:freelance:${{ github.event.inputs.environment }}
        working-directory: freelance-website
      
      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ github.event.inputs.aws-access-key-id }}
          aws-secret-access-key: ${{ github.event.inputs.aws-secret-access-key }}
          aws-session-token: ${{ github.event.inputs.aws-session-token }}
          aws-region: ap-southeast-2

      - name: Remove all files from S3
        run: |
          if [ "${{ github.event.inputs.platform }}" = "freelance" ]; then
            aws s3 rm s3://$S3_BUCKET_NAME --recursive --region $AWS_REGION
          elif [ "${{ github.event.inputs.platform }}" = "peterpans" ]; then
            aws s3 rm s3://$S3_BUCKET_NAME_PETERPANS --recursive --region $AWS_REGION
          fi

      - name: Deploy Frontend to S3
        run: |
          if [ "${{ github.event.inputs.platform }}" = "freelance" ]; then
            aws s3 sync freelance-website/build/ s3://$S3_BUCKET_NAME --delete --region $AWS_REGION
          elif [ "${{ github.event.inputs.platform }}" = "peterpans" ]; then
            aws s3 sync freelance-website/build/ s3://$S3_BUCKET_NAME_PETERPANS --delete --region $AWS_REGION
          fi