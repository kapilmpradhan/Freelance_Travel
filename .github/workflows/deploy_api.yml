name: Freelance travel api deployment

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Docker image name'
        required: false
        default: 'truenarydev/ft-api'
      image_tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'
      docker_hub_username:
        description: 'Username of Docker hub'
        required: true
      docker_hub_password:
        description: 'Password of Docker hub'
        required: true
      environment:
        description: 'Environment to deploy to (staging or production)'
        required: true
        default: 'staging'

env:
      APP_NAME: ${{ vars.APP_NAME }}
      APP_ENV: ${{ vars.APP_ENV }}
      APP_KEY: ${{ vars.APP_KEY }}
      APP_DEBUG: ${{ vars.APP_DEBUG }}
      APP_URL: ${{ vars.APP_URL }}
      APP_PORT: ${{ vars.APP_PORT }}
      NETWORK_NAME: ${{vars.NETWORK_NAME}}
      API_IP_ADDRESS: ${{ vars.API_IP_ADDRESS }}
      DB_CONNECTION: ${{ vars.DB_CONNECTION }}
      DB_HOST: ${{ vars.DB_IP_ADDRESS }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_DATABASE: ${{ vars.DB_DATABASE }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
      DB_PASSWORD: ${{ vars.DB_PASSWORD }}
      DB_PASSWORD_ROOT: ${{ vars.DB_PASSWORD_ROOT }}
      REDIS_IP_ADDRESS: ${{ vars.REDIS_IP_ADDRESS }}
      REDIS_PORT: ${{ vars.REDIS_PORT }}
      REDIS_PASSWORD: ${{ vars.REDIS_PASSWORD }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      SSO_TYPE_GOOGLE: ${{ vars.SSO_TYPE_GOOGLE }}
      SSO_TYPE_APPLE: ${{ vars.SSO_TYPE_APPLE }}
      JWT_TOKEN_ENCRYPT_ALGORITHM: ${{ vars.JWT_TOKEN_ENCRYPT_ALGORITHM }}
      ACCESS_TOKEN_VALIDITY_PERIOD_IN_MINUTES: ${{ vars.ACCESS_TOKEN_VALIDITY_PERIOD_IN_MINUTES }}
      REFRESH_TOKEN_VALIDITY_PERIOD_IN_MINUTES: ${{ vars.REFRESH_TOKEN_VALIDITY_PERIOD_IN_MINUTES }}
      APP_DOCKER_IMAGE_NAME: ${{ github.event.inputs.image_name }}
      APP_DOCKER_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      APPLE_CLIENT_IDS: ${{ vars.APPLE_CLIENT_IDS }}
      GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS }}
      APPLE_CLIENT_ID: ${{ vars.APPLE_CLIENT_ID }}
      MAIL_MAILER: ${{ vars.MAIL_MAILER }}
      MAIL_HOST: ${{ vars.MAIL_HOST }}
      MAIL_PORT: ${{ vars.MAIL_PORT }}
      BREVO_MAIL_API_KEY: ${{ vars.BREVO_MAIL_API_KEY }}
      BREVO_VERIFY_EMAIL_TEMPLATE_ID: ${{ vars.BREVO_VERIFY_EMAIL_TEMPLATE_ID }}
      BREVO_FORGOT_PASSWORD_TEMPLATE_ID: ${{ vars.BREVO_FORGOT_PASSWORD_TEMPLATE_ID }}
      BREVO_BOOKING_NOTIFICATION_TEMPLATE_ID: ${{ vars.BREVO_BOOKING_NOTIFICATION_TEMPLATE_ID }}
      BREVO_ORDER_COMPLETE_TEMPLATE_ID: ${{ vars.BREVO_ORDER_COMPLETE_TEMPLATE_ID }}
      MAIL_ENCRYPTION: ${{ vars.MAIL_ENCRYPTION }}
      MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
      MAIL_FROM_NAME: ${{ vars.APP_NAME }}
      TDMS_CUSTOMER_API_USERNAME: ${{secrets.TDMS_CUSTOMER_API_USERNAME}}
      TDMS_CUSTOMER_API_PASSWORD: ${{secrets.TDMS_CUSTOMER_API_PASSWORD}}
      TDMS_API_URL: ${{vars.TDMS_API_URL}}
      TDMS_CUSTOMER_API_URL: ${{vars.TDMS_CUSTOMER_API_URL}}
      RETACK_ERROR_LOGGING_URL: ${{vars.RETACK_ERROR_LOGGING_URL}}
      RETACK_ENV_KEY: ${{vars.RETACK_ENV_KEY}}
      DEFAULT_AGENT_BRANCH_CODE: ${{vars.DEFAULT_AGENT_BRANCH_CODE}}
      DEFAULT_AGENT_EMAIL: ${{vars.DEFAULT_AGENT_EMAIL}}
      DEFAULT_AGENT_PASSWORD: ${{vars.DEFAULT_AGENT_PASSWORD}}
      FIREBASE_CREDENTIALS_FILE_PATH: ${{vars.FIREBASE_CREDENTIALS_FILE_PATH}}
      FIREBASE_CREDENTIAL_JSON: ${{secrets.FIREBASE_CREDENTIAL_JSON}}
      FIREBASE_PROJECT_ID: ${{vars.FIREBASE_PROJECT_ID}}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - name: Fail on Invalid Environment
      if: ${{ github.event.inputs.environment != 'staging' && github.event.inputs.environment != 'production' }}
      run: |
        echo "Invalid environment: ${{ github.event.inputs.environment }}. Options are 'staging' or 'production."
        exit 1

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Create required files
      run: |
        echo "Creating .env file..."

        if [ -f deployment/env.template.txt ]; then
            envsubst < deployment/env.template.txt > .env
            echo ".env file created successfully."
        else
            echo "Error: env.template.txt not found!" >&2
            exit 1
        fi

        echo "Creating Firebase credential JSON file..."
        mkdir -p storage/app/firebase

        # Ensure FIREBASE_CREDENTIALS_FILE_PATH is defined
        if [ -z "$FIREBASE_CREDENTIALS_FILE_PATH" ]; then
            echo "Error: FIREBASE_CREDENTIALS_FILE_PATH is not defined!" >&2
            exit 1
        fi

        echo "${{ secrets.FIREBASE_CREDENTIALS_JSON }}" > storage/$FIREBASE_CREDENTIALS_FILE_PATH
        echo "Firebase credential file created successfully."

    - name: Log in to Docker Hub
      run: |
        echo "${{ github.event.inputs.docker_hub_password }}" | docker login --username ${{ github.event.inputs.docker_hub_username }} --password-stdin

    - name: Build and push Docker image
      run: |
        docker build -t $APP_DOCKER_IMAGE_NAME:$APP_DOCKER_IMAGE_TAG .
        docker push $APP_DOCKER_IMAGE_NAME:$APP_DOCKER_IMAGE_TAG

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      
    - name: Deploy api to EC2 instance
      run: |
        # Write the RSA private key to a temporary file
        echo "$SSH_PRIVATE_KEY" > ec2_key.pem
        # Set the appropriate permissions for the private key
        chmod 400 ec2_key.pem

        # Create the .ssh directory if it doesn't exist
        mkdir -p ~/.ssh

        # Add EC2's IP address to known hosts to avoid host key verification issues
        ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

        # Create and Copy docker compose file to EC2 instance
        envsubst < deployment/api-compose.template.txt > api-compose.yml
        scp -i ec2_key.pem api-compose.yml $EC2_USER@$EC2_HOST:~/deploy/api/api-compose.yml
        scp -i ec2_key.pem -r public $EC2_USER@$EC2_HOST:~/deploy/api/public

        # SSH into the EC2 instance and pull the new Docker image, then restart the services using Docker Compose
        echo 'Getting into EC2 server'
        ssh -i ec2_key.pem $EC2_USER@$EC2_HOST << EOF
          cd ~/deploy/api
          docker-compose -f api-compose.yml down
          echo "removing previous images"
          docker rmi -f $(docker images freelanctravel/ft-api --format "{{.ID}}")
          docker-compose -f api-compose.yml up -d

          echo "Reloading Nginx"
          sudo systemctl reload nginx
        EOF
