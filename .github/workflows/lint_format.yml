name: PHP Lint, Format, and Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint_and_format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xdebug
          ini-values: |
            memory_limit=-1
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Print PHP version
        run: php -v

      - name: Print Composer Dependencies
        run: composer show --installed
        
      - name: Run PHP-CS-Fixer (Format)
        run: ./vendor/bin/php-cs-fixer fix --rules=@PSR12 app/ --verbose
        
      - name: Run PHP CodeSniffer (Lint)
        run: ./vendor/bin/phpcs --standard=PSR12 app/


      - name: Display Code Coverage
        run: |
          ./vendor/bin/phpunit --coverage-text | tee coverage.txt
          echo "Code Coverage Report:"
          cat coverage.txt
