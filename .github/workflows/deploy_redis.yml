name: Freelance travel redis deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (staging or production)'
        required: true
        default: 'staging'

env:
  REDIS_IP_ADDRESS: ${{ vars.REDIS_IP_ADDRESS }}
  REDIS_PORT: ${{ vars.REDIS_PORT }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}
  NETWORK_NAME: ${{ vars.NETWORK_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
    - name: Fail on Invalid Environment
      if: ${{ github.event.inputs.environment != 'staging' && github.event.inputs.environment != 'production' }}
      run: |
        echo "Invalid environment: ${{ github.event.inputs.environment }}. Options are 'staging' or 'production."
        exit 1
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Deploy redis to EC2 instance
      run: |
        # Write the RSA private key to a temporary file
        echo "$SSH_PRIVATE_KEY" > ec2_key.pem
        # Set the appropriate permissions for the private key
        chmod 400 ec2_key.pem
        # Create the .ssh directory if it doesn't exist
        mkdir -p ~/.ssh
        # Add EC2's IP address to known hosts to avoid host key verification issues
        ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
        # Select the appropriate template based on the environment
        TEMPLATE_FILE="deployment/redis-compose.template.txt"
        # Create and copy docker compose file to EC2 instance
        envsubst < $TEMPLATE_FILE > redis-compose.yml
        scp -i ec2_key.pem redis-compose.yml $EC2_USER@$EC2_HOST:~/deploy/redis/redis-compose.yml
        # SSH into the EC2 instance and pull the new Docker image, then restart the services using Docker Compose
        echo 'Getting into EC2 server'
        ssh -i ec2_key.pem $EC2_USER@$EC2_HOST << EOF
          cd ~/deploy/redis
          docker-compose -f redis-compose.yml down
          docker-compose -f redis-compose.yml up -d
        EOF
